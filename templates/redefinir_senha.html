<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Nova senha - CAEC Tira-Dúvidas</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="pagina-login">

        <div class="caixa-login">

            <h1>🔐 Nova senha</h1>

            <p>
                Crie uma nova senha para sua conta.
            </p>

            <form method="POST">

                <input
                    type="password"
                    name="senha"
                    placeholder="Nova senha"
                    required
                >

                <input
                    type="password"
                    name="confirmar_senha"
                    placeholder="Confirme a nova senha"
                    required
                >

                <button type="submit">
                    Alterar senha
                </button>

            </form>

            {% if mensagem %}

            <p class="mensagem-login">
                {{ mensagem }}
            </p>

            {% endif %}

            <p>
                <a href="/login">
                    ← Voltar para o login
                </a>
            </p>

        </div>

    </div>

</body>

</html>
