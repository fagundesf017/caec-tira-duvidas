<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Recuperar senha - CAEC Tira-Dúvidas</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="pagina-login">

        <div class="caixa-login">

            <h1>🔑 Recuperar senha</h1>

            <p>
                Digite o e-mail cadastrado na sua conta.
            </p>

            <form method="POST">

                <input
                    type="email"
                    name="email"
                    placeholder="Seu e-mail"
                    required
                >

                <button type="submit">
                    Continuar
                </button>

            </form>

            {% if mensagem %}

<p class="mensagem-login">
    {{ mensagem }}
</p>

{% endif %}

            <p>
                <a href="/login">
                    ← Voltar para o login
                </a>
            </p>

        </div>

    </div>

</body>

</html>
